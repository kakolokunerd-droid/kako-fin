    <script>
      // Aplicar tema antes do paint para evitar flash no iPhone/Safari
      (function () {
        try {
          var pref = localStorage.getItem('kako-fin-theme') || 'system';
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      tailwind.config = {

        body { font-family: 'Inter', sans-serif; }

        /* Tema escuro global (Safari iOS / desktop) */

        html.dark input,

        }

        html.dark .shadow-sm,

        html.dark .shadow-2xl {
